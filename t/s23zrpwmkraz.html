<script>
(() => {
  // Change these values to retime the whole celebration. Every phase below is derived from them.
  const TREE_MOTION = Object.freeze({
    masteryMs: 500,
    edgeTravelMs: 800,
    unlockMs: 600,
    impactMs: 420,
    toastVisibleMs: 3600,
  });
  const TREE_PHASE = Object.freeze({
    edgeStartMs: TREE_MOTION.masteryMs,
    arrivalMs: TREE_MOTION.masteryMs + TREE_MOTION.edgeTravelMs,
    toastStartMs: TREE_MOTION.masteryMs + TREE_MOTION.edgeTravelMs + TREE_MOTION.unlockMs,
  });
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
  const transitionKey = `tree-transition:${window.location.pathname}`;
  const windowNamePrefix = `${transitionKey}:`;

  const nodeKey = (node) => {
    const unit = node.closest('section.unit')?.dataset.unitId || 'legacy';
    return `${unit}\u241f${node.dataset.node}`;
  };

  const captureState = () => {
    const nodes = {};
    document.querySelectorAll('.node[data-node]').forEach((node) => {
      nodes[nodeKey(node)] = node.dataset.state;
    });
    const snapshot = JSON.stringify({ nodes });
    try { sessionStorage.setItem(transitionKey, snapshot); } catch (_) {}
    // window.name is a same-tab fallback for browsers that partition or disable session storage.
    try { window.name = windowNamePrefix + snapshot; } catch (_) {}
  };

  const priorState = (() => {
    try {
      if (window.name.startsWith(windowNamePrefix)) {
        return JSON.parse(window.name.slice(windowNamePrefix.length));
      }
    } catch (_) {}
    try { return JSON.parse(sessionStorage.getItem(transitionKey) || 'null'); } catch (_) { return null; }
  })();

  document.querySelectorAll('.tree-stage').forEach((stage) => {
    const svg = stage.querySelector('svg.tree-canvas');
    const viewport = svg && svg.querySelector('.tree-viewport');
    const reset = stage.parentElement.querySelector('.tree-reset');
    if (!svg || !viewport) return;

    const viewBox = svg.viewBox.baseVal;
    const state = { scale: 1, x: 0, y: 0, pointer: null, clientX: 0, clientY: 0 };

    const render = () => {
      viewport.setAttribute('transform', `translate(${state.x} ${state.y}) scale(${state.scale})`);
    };

    const svgPoint = (clientX, clientY) => {
      const rect = svg.getBoundingClientRect();
      const renderedScale = Math.min(rect.width / viewBox.width, rect.height / viewBox.height);
      const renderedWidth = viewBox.width * renderedScale;
      const renderedHeight = viewBox.height * renderedScale;
      return {
        x: viewBox.x + (clientX - rect.left - (rect.width - renderedWidth) / 2) / renderedScale,
        y: viewBox.y + (clientY - rect.top - (rect.height - renderedHeight) / 2) / renderedScale,
        renderedScale,
      };
    };

    stage.addEventListener('wheel', (event) => {
      event.preventDefault();
      const point = svgPoint(event.clientX, event.clientY);
      const nextScale = clamp(state.scale * Math.exp(-event.deltaY * 0.0015), 0.35, 6);
      const worldX = (point.x - state.x) / state.scale;
      const worldY = (point.y - state.y) / state.scale;
      state.x = point.x - worldX * nextScale;
      state.y = point.y - worldY * nextScale;
      state.scale = nextScale;
      render();
    }, { passive: false });

    stage.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      state.pointer = event.pointerId;
      state.clientX = event.clientX;
      state.clientY = event.clientY;
      stage.setPointerCapture(event.pointerId);
      stage.classList.add('dragging');
    });

    stage.addEventListener('pointermove', (event) => {
      if (state.pointer !== event.pointerId) return;
      const point = svgPoint(event.clientX, event.clientY);
      state.x += (event.clientX - state.clientX) / point.renderedScale;
      state.y += (event.clientY - state.clientY) / point.renderedScale;
      state.clientX = event.clientX;
      state.clientY = event.clientY;
      render();
    });

    const endDrag = (event) => {
      if (state.pointer !== event.pointerId) return;
      state.pointer = null;
      stage.classList.remove('dragging');
      if (stage.hasPointerCapture(event.pointerId)) stage.releasePointerCapture(event.pointerId);
    };
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);

    const resetView = () => {
      state.scale = 1;
      state.x = 0;
      state.y = 0;
      render();
    };
    if (reset) reset.addEventListener('click', resetView);
    stage.addEventListener('dblclick', resetView);
  });

  const cssColor = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const makeEllipse = (base, className, fill, stroke, strokeWidth = '1.2') => {
    const copy = base.cloneNode(false);
    copy.removeAttribute('style');
    copy.setAttribute('class', `motion-overlay ${className}`);
    copy.setAttribute('fill', fill);
    copy.setAttribute('stroke', stroke);
    copy.setAttribute('stroke-width', strokeWidth);
    return copy;
  };

  const addEnergyRings = (node, base, outward, delay, duration) => {
    const rings = [
      makeEllipse(base, 'energy-ring energy-ring-outer', 'none', '#FFFFFF', '5'),
      makeEllipse(base, 'energy-ring energy-ring-inner', 'none', '#263238', '1.5'),
    ];
    rings.forEach((ring) => {
      node.insertBefore(ring, node.querySelector('text'));
      const frames = outward
        ? [{ transform: 'scale(0)', opacity: 1 }, { transform: 'scale(1)', opacity: 1 }]
        : [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(0)', opacity: 1 }];
      ring.animate(frames, { duration, delay, easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'both' })
        .finished.finally(() => ring.remove());
    });
  };

  const animateMastery = (node) => {
    const base = node.querySelector(':scope > ellipse');
    if (!base) return;
    const oldFill = makeEllipse(base, 'mastery-old', cssColor('--unlocked-fill'), cssColor('--unlocked-stroke'));
    const energy = makeEllipse(base, 'mastery-energy', cssColor('--completed-fill'), cssColor('--completed-stroke'));
    node.insertBefore(oldFill, node.querySelector('text'));
    node.insertBefore(energy, node.querySelector('text'));
    energy.animate([{ transform: 'scale(0)' }, { transform: 'scale(1)' }], {
      duration: TREE_MOTION.masteryMs, easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'both'
    }).finished.finally(() => { oldFill.remove(); energy.remove(); });
    addEnergyRings(node, base, true, 0, TREE_MOTION.masteryMs);
  };

  const animateEdge = (edge) => {
    const parent = edge.parentNode;
    const resting = edge.cloneNode(false);
    const energy = edge.cloneNode(false);
    [resting, energy].forEach((line) => {
      line.removeAttribute('marker-end');
      line.setAttribute('class', 'motion-overlay edge-travel');
    });
    resting.setAttribute('stroke', cssColor('--edge-resting'));
    energy.setAttribute('stroke', cssColor('--edge-powered'));
    energy.setAttribute('stroke-width', '2.4');
    parent.insertBefore(resting, edge.nextSibling);
    parent.insertBefore(energy, resting.nextSibling);
    const length = energy.getTotalLength();
    energy.style.strokeDasharray = `${length}`;
    energy.animate([{ strokeDashoffset: length }, { strokeDashoffset: 0 }], {
      duration: TREE_MOTION.edgeTravelMs, delay: TREE_PHASE.edgeStartMs,
      easing: 'cubic-bezier(.4,0,.2,1)', fill: 'both'
    }).finished.finally(() => { resting.remove(); energy.remove(); });
  };

  const animateUnlock = (node) => {
    const base = node.querySelector(':scope > ellipse');
    if (!base) return;
    const cover = makeEllipse(base, 'unlock-cover', cssColor('--locked-fill'), cssColor('--locked-stroke'));
    node.insertBefore(cover, node.querySelector('text'));
    cover.animate([{ transform: 'scale(1)' }, { transform: 'scale(0)' }], {
      duration: TREE_MOTION.unlockMs, delay: TREE_PHASE.arrivalMs,
      easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'both'
    }).finished.finally(() => cover.remove());
    addEnergyRings(node, base, false, TREE_PHASE.arrivalMs, TREE_MOTION.unlockMs);
  };

  const animateLockedImpact = (node) => {
    const base = node.querySelector(':scope > ellipse');
    if (!base) return;
    const pulse = makeEllipse(base, 'locked-impact', 'none', '#455A64', '2.5');
    node.insertBefore(pulse, node.querySelector('text'));
    pulse.animate([
      { transform: 'scale(1)', opacity: 0 },
      { transform: 'scale(1.08)', opacity: 1, offset: .35 },
      { transform: 'scale(1.14)', opacity: 0 },
    ], { duration: TREE_MOTION.impactMs, delay: TREE_PHASE.arrivalMs, easing: 'ease-out' })
      .finished.finally(() => pulse.remove());
  };

  const numberWord = (count) => count === 1 ? 'One' : count === 2 ? 'Two' : String(count);
  const showCongratulations = (mastered, unlockedCount) => {
    let message;
    if (mastered.length === 1) {
      message = `Congratulations, you have mastered "${mastered[0].dataset.node}".`;
    } else {
      message = `Congratulations, you have mastered ${mastered.length} competencies.`;
    }
    if (unlockedCount === 1) message += ' One new leaf has been unlocked.';
    if (unlockedCount > 1) message += ` ${numberWord(unlockedCount)} new leaves have been unlocked.`;
    const toast = document.createElement('div');
    toast.className = 'mastery-toast';
    toast.setAttribute('role', 'status');
    toast.textContent = message;
    document.body.appendChild(toast);
    const delay = reducedMotion ? 0 : TREE_PHASE.toastStartMs;
    toast.animate([
      { opacity: 0, transform: 'translate(-50%, 12px)' },
      { opacity: 1, transform: 'translate(-50%, 0)', offset: .12 },
      { opacity: 1, transform: 'translate(-50%, 0)', offset: .86 },
      { opacity: 0, transform: 'translate(-50%, 8px)' },
    ], { duration: TREE_MOTION.toastVisibleMs, delay, easing: 'ease-out', fill: 'both' })
      .finished.finally(() => toast.remove());
  };

  const playProgressTransition = () => {
    if (!priorState?.nodes) return;
    const allNodes = [...document.querySelectorAll('.node[data-node]')];
    const mastered = allNodes.filter((node) =>
      node.dataset.state === 'completed' && priorState.nodes[nodeKey(node)] !== 'completed');
    if (!mastered.length) return;
    const unlocked = allNodes.filter((node) =>
      node.dataset.state === 'unlocked' && priorState.nodes[nodeKey(node)] === 'locked');
    if (!reducedMotion) {
      mastered.forEach(animateMastery);
      const reachedLocked = new Set();
      mastered.forEach((node) => {
        const unit = node.closest('section.unit');
        [...(unit?.querySelectorAll('.edge[data-source]') || [])]
          .filter((edge) => edge.dataset.source === node.dataset.node)
          .forEach((edge) => {
          animateEdge(edge);
          const target = [...unit.querySelectorAll('.node[data-node]')]
            .find((candidate) => candidate.dataset.node === edge.dataset.target);
          if (target?.dataset.state === 'locked') reachedLocked.add(target);
        });
      });
      unlocked.forEach(animateUnlock);
      reachedLocked.forEach(animateLockedImpact);
    }
    showCongratulations(mastered, unlocked.length);
  };

  playProgressTransition();
  captureState();

  const currentBuild = document.querySelector('meta[name="tree-build-id"]')?.content;
  const versionUrl = new URL('../version.json', window.location.href);
  let pollInFlight = false;

  const probeForBuild = async (expectedBuild) => {
    const probeUrl = new URL(window.location.href);
    probeUrl.searchParams.set('_tree_probe', Date.now().toString());
    const response = await fetch(probeUrl, { cache: 'no-store' });
    if (!response.ok) return;
    const freshPage = new DOMParser().parseFromString(await response.text(), 'text/html');
    const availableBuild = freshPage.querySelector('meta[name="tree-build-id"]')?.content;
    if (availableBuild !== expectedBuild) return;

    const destination = new URL(window.location.href);
    destination.searchParams.delete('_tree_probe');
    destination.searchParams.set('_tree_build', expectedBuild);
    captureState();
    window.location.replace(destination);
  };

  const checkForUpdate = async () => {
    if (pollInFlight || document.hidden || !currentBuild) return;
    pollInFlight = true;
    try {
      const requestUrl = new URL(versionUrl);
      requestUrl.searchParams.set('_tree_check', Date.now().toString());
      const response = await fetch(requestUrl, { cache: 'no-store' });
      if (!response.ok) return;
      const latestBuild = (await response.json()).build;
      if (latestBuild && latestBuild !== currentBuild) await probeForBuild(latestBuild);
    } catch (_) {
      // A missed poll is harmless; the next five-second check tries again.
    } finally {
      pollInFlight = false;
    }
  };

  window.setInterval(checkForUpdate, 5000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) checkForUpdate();
  });
})();
</script>
</body>
</html>
